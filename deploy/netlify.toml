# BEMAT — конфиг Netlify. Переименуй в netlify.toml в корне проекта.
[build]
  command = "npm run build:seo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-фолбэк: пре-рендеренные /books/index.html и т. д. Netlify отдаёт сам,
# этот redirect — только для «глубоких» адресов вида /что-то/ещё
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
