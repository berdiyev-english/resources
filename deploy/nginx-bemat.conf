# BEMAT — конфиг nginx для VPS
# 1) скопируй в /etc/nginx/sites-available/bemat.ru
# 2) поправь root и пути к сертификатам Let's Encrypt
# 3) ln -s /etc/nginx/sites-available/bemat.ru /etc/nginx/sites-enabled/
# 4) nginx -t && systemctl reload nginx
#
# Сборка: npm run build:seo  →  /var/www/bemat/dist

# HTTP → HTTPS + www → без www
server {
    listen 80;
    listen [::]:80;
    server_name bemat.ru www.bemat.ru;
    return 301 https://bemat.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bemat.ru;

    ssl_certificate     /etc/letsencrypt/live/bemat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemat.ru/privkey.pem;

    return 301 https://bemat.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bemat.ru;

    root /var/www/bemat/dist;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/bemat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemat.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Сжатие
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA + пре-рендеренные страницы ---
    # /books → dist/books/index.html (SEO-версия), иначе — общий index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Индексируемые страницы отдаём всегда свежими, но с кэшем на стороне CDN
    location ~ ^/(books|video|practice|speak|courses|bots|about)/?$ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }

    # Service worker и манифест — без агрессивного кэша, иначе не обновятся
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # robots / sitemap
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # Хэшированные ассеты — можно кэшировать на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /icophot/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
